<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six Line Shift - Split Flap Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0b0d10;
      --board-bg: #14171d;
      --card-bg: #1e222a;
      --card-top-bg: #252a34;
      --card-bottom-bg: #1c2028;
      --text-color: #f0f3f8;
      --accent-color: #ffaa00;
      --accent-past: #00e5ff;
      --border-color: #222731;
      --hinge-color: #050607;
      --subtext-color: #7a8b9e;
      --label-color: #617185;
      --font-family: 'Courier New', Courier, monospace;
    }

    /* Themes */
    body.theme-airport {
      --bg-color: #121212;
      --board-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --card-top-bg: #333333;
      --card-bottom-bg: #222222;
      --text-color: #ffcc00;
      --accent-color: #ffcc00;
      --accent-past: #00ff66;
      --border-color: #383838;
      --hinge-color: #111111;
      --subtext-color: #a0a0a0;
      --label-color: #888888;
    }

    body.theme-scifi {
      --bg-color: #030a06;
      --board-bg: #08170e;
      --card-bg: #0c2416;
      --card-top-bg: #11331e;
      --card-bottom-bg: #091c11;
      --text-color: #33ff77;
      --accent-color: #33ff77;
      --accent-past: #00ffff;
      --border-color: #1a4d2d;
      --hinge-color: #020804;
      --subtext-color: #52a36d;
      --label-color: #3d7a52;
    }

    body.theme-light {
      --bg-color: #e5e9f0;
      --board-bg: #d8dee9;
      --card-bg: #eceff4;
      --card-top-bg: #f0f4f8;
      --card-bottom-bg: #e2e7ef;
      --text-color: #2e3440;
      --accent-color: #d08770;
      --accent-past: #5e81ac;
      --border-color: #c0c8d8;
      --hinge-color: #8892b0;
      --subtext-color: #4c566a;
      --label-color: #434c5e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .flap-card {
      position: relative;
      width: clamp(40px, 6vw, 75px);
      height: clamp(60px, 9vw, 110px);
      background-color: var(--card-bg);
      border-radius: 6px;
      font-size: clamp(2.5rem, 5.5vw, 4.8rem);
      font-weight: 800;
      color: var(--text-color);
      perspective: 400px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      display: inline-block;
    }

    .top-half, .bottom-half {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background-color: var(--card-top-bg);
      text-align: center;
      transition: background-color 0.3s ease;
    }

    .top-half {
      top: 0;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      border-bottom: 1px solid var(--hinge-color);
      line-height: clamp(60px, 9vw, 110px);
    }

    .bottom-half {
      bottom: 0;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      background-color: var(--card-bottom-bg);
      line-height: 0px;
    }

    .flip-leaf {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      text-align: center;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      z-index: 5;
    }

    .flip-leaf.top {
      top: 0;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      background-color: var(--card-top-bg);
      line-height: clamp(60px, 9vw, 110px);
      transform-origin: bottom;
      border-bottom: 1px solid var(--hinge-color);
    }

    .flip-leaf.bottom {
      bottom: 0;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      background-color: var(--card-bottom-bg);
      line-height: 0px;
      transform-origin: top;
    }

    /* Center Hinge Line */
    .flap-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--hinge-color);
      z-index: 10;
      box-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* Split flap side notch effects */
    .flap-card::before {
      content: '';
      position: absolute;
      top: calc(50% - 3px);
      left: -2px;
      right: -2px;
      height: 6px;
      z-index: 11;
      pointer-events: none;
      background: radial-gradient(circle at left, transparent 2px, var(--hinge-color) 3px),
                  radial-gradient(circle at right, transparent 2px, var(--hinge-color) 3px);
      background-size: 50% 100%;
      background-repeat: no-repeat;
      background-position: left center, right center;
    }

    /* Keyframe Animations */
    .animate-top {
      animation: flipTop 0.12s ease-in forwards;
    }

    .animate-bottom {
      animation: flipBottom 0.12s ease-out forwards;
    }

    @keyframes flipTop {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }

    @keyframes flipBottom {
      0% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    /* Modal transitions */
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
  </style>
</head>
<body class="theme-terminal min-h-screen flex flex-col justify-between items-center p-4 md:p-8">

  <header class="w-full max-w-5xl flex justify-between items-center mb-6 z-20">
    <div class="flex items-center space-x-3">
      <div class="p-2 rounded-lg bg-[var(--board-bg)] border border-[var(--border-color)]">
        <i class="fa-solid fa-clock-rotate-left text-[var(--accent-color)] text-xl"></i>
      </div>
      <span class="text-xs md:text-sm font-bold tracking-widest uppercase opacity-80" id="header-brand">FLAP TIMER</span>
    </div>

    <!-- Action Bar -->
    <div class="flex items-center gap-2 md:gap-3">
      <button id="audio-toggle-btn" title="Toggle Mechanical Audio" class="px-3 py-2 rounded-md bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] text-xs md:text-sm transition flex items-center gap-2">
        <i id="audio-icon" class="fa-solid fa-volume-xmark text-red-400"></i>
        <span class="hidden sm:inline">Audio</span>
      </button>

      <button id="settings-btn" title="Timer Settings" class="px-3 py-2 rounded-md bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] text-xs md:text-sm transition flex items-center gap-2">
        <i class="fa-solid fa-sliders text-[var(--accent-color)]"></i>
        <span class="hidden sm:inline">Configure</span>
      </button>

      <button id="share-btn" title="Share Timer Link" class="px-3 py-2 rounded-md bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] text-xs md:text-sm transition flex items-center gap-2">
        <i class="fa-solid fa-share-nodes text-blue-400"></i>
        <span class="hidden sm:inline">Share</span>
      </button>

      <button id="fullscreen-btn" title="Toggle Fullscreen" class="px-3 py-2 rounded-md bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] text-xs md:text-sm transition">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <main class="w-full max-w-5xl flex flex-col items-center justify-center my-auto py-6">
    
    <!-- Title & Status Section -->
    <div class="header-panel text-center mb-8 md:mb-12">
      <h1 id="main-title" class="text-lg md:text-2xl font-bold tracking-[0.25em] text-[var(--subtext-color)] uppercase mb-3 transition-colors">
        SIX LINE SHIFT
      </h1>
      
      <div id="status-tag" class="status-indicator inline-flex items-center gap-2 px-4 py-1.5 rounded bg-amber-500/10 border border-[var(--accent-color)] text-[var(--accent-color)] font-bold tracking-[0.2em] text-sm md:text-lg mb-3 shadow-lg transition-colors">
        <span class="w-2 h-2 rounded-full bg-[var(--accent-color)] animate-ping"></span>
        <span id="status-text">T-MINUS</span>
      </div>
      
      <div id="target-date-display" class="target-date text-xs md:text-sm text-[var(--subtext-color)] tracking-widest uppercase font-semibold">
        TARGET: FEB 15, 2027 • 22:10:00 UTC
      </div>
    </div>

    <!-- Main Split-Flap Board -->
    <div class="board bg-[var(--board-bg)] p-4 sm:p-6 md:p-10 rounded-2xl border-2 border-[var(--border-color)] shadow-2xl flex flex-wrap justify-center gap-4 sm:gap-6 md:gap-8 transition-colors duration-300">
      
      <!-- DAYS (3 Digits) -->
      <div class="group flex flex-col items-center gap-3">
        <div class="digits-container flex gap-1.5 sm:gap-2">
          <div class="flap-card" id="d2"></div>
          <div class="flap-card" id="d1"></div>
          <div class="flap-card" id="d0"></div>
        </div>
        <div class="group-label text-[10px] sm:text-xs font-bold tracking-[0.3em] text-[var(--label-color)] uppercase">DAYS</div>
      </div>

      <!-- HOURS (2 Digits) -->
      <div class="group flex flex-col items-center gap-3">
        <div class="digits-container flex gap-1.5 sm:gap-2">
          <div class="flap-card" id="h1"></div>
          <div class="flap-card" id="h0"></div>
        </div>
        <div class="group-label text-[10px] sm:text-xs font-bold tracking-[0.3em] text-[var(--label-color)] uppercase">HOURS</div>
      </div>

      <!-- MINUTES (2 Digits) -->
      <div class="group flex flex-col items-center gap-3">
        <div class="digits-container flex gap-1.5 sm:gap-2">
          <div class="flap-card" id="m1"></div>
          <div class="flap-card" id="m0"></div>
        </div>
        <div class="group-label text-[10px] sm:text-xs font-bold tracking-[0.3em] text-[var(--label-color)] uppercase">MINS</div>
      </div>

      <!-- SECONDS (2 Digits) -->
      <div class="group flex flex-col items-center gap-3">
        <div class="digits-container flex gap-1.5 sm:gap-2">
          <div class="flap-card" id="s1"></div>
          <div class="flap-card" id="s0"></div>
        </div>
        <div class="group-label text-[10px] sm:text-xs font-bold tracking-[0.3em] text-[var(--label-color)] uppercase">SECS</div>
      </div>

    </div>

    <!-- Quick Preset Pill Bar -->
    <div class="mt-8 flex flex-wrap justify-center gap-2 max-w-2xl px-4">
      <button onclick="applyPreset('1h')" class="px-3 py-1.5 text-xs rounded-full bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] transition opacity-80 hover:opacity-100">+1 Hour</button>
      <button onclick="applyPreset('24h')" class="px-3 py-1.5 text-xs rounded-full bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] transition opacity-80 hover:opacity-100">+24 Hours</button>
      <button onclick="applyPreset('7d')" class="px-3 py-1.5 text-xs rounded-full bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] transition opacity-80 hover:opacity-100">+7 Days</button>
      <button onclick="applyPreset('newyear')" class="px-3 py-1.5 text-xs rounded-full bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] transition opacity-80 hover:opacity-100">Next New Year</button>
      <button onclick="applyPreset('default')" class="px-3 py-1.5 text-xs rounded-full bg-[var(--board-bg)] border border-[var(--border-color)] hover:border-[var(--accent-color)] transition opacity-80 hover:opacity-100">Feb 15, 2027</button>
    </div>
  </main>

  <footer class="w-full max-w-5xl text-center text-xs text-[var(--subtext-color)] py-4 opacity-60">
    Mechanical Split-Flap Timer Engine • Web Edition
  </footer>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center p-4 z-50">
    <div class="bg-[var(--board-bg)] border-2 border-[var(--border-color)] text-[var(--text-color)] rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
      
      <div class="flex justify-between items-center border-b border-[var(--border-color)] pb-4">
        <h3 class="text-lg font-bold tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-gear text-[var(--accent-color)]"></i>
          TIMER CONFIGURATION
        </h3>
        <button id="close-modal-btn" class="p-1 text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Config Form -->
      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs uppercase tracking-widest text-[var(--subtext-color)] mb-1">Title</label>
          <input type="text" id="input-title" class="w-full bg-[var(--bg-color)] border border-[var(--border-color)] rounded p-2.5 text-sm focus:outline-none focus:border-[var(--accent-color)]" placeholder="Timer Title">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-widest text-[var(--subtext-color)] mb-1">Target Date & Time</label>
          <input type="datetime-local" id="input-datetime" class="w-full bg-[var(--bg-color)] border border-[var(--border-color)] rounded p-2.5 text-sm focus:outline-none focus:border-[var(--accent-color)] text-[var(--text-color)]">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-widest text-[var(--subtext-color)] mb-2">Visual Theme</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="setTheme('terminal')" class="p-2.5 border rounded text-xs text-left bg-[#0b0d10] text-[#ffaa00] border-[#222731] hover:opacity-90">
              Terminal Amber
            </button>
            <button type="button" onclick="setTheme('airport')" class="p-2.5 border rounded text-xs text-left bg-[#121212] text-[#ffcc00] border-[#383838] hover:opacity-90">
              Vintage Airport
            </button>
            <button type="button" onclick="setTheme('scifi')" class="p-2.5 border rounded text-xs text-left bg-[#030a06] text-[#33ff77] border-[#1a4d2d] hover:opacity-90">
              Retro Sci-Fi
            </button>
            <button type="button" onclick="setTheme('light')" class="p-2.5 border rounded text-xs text-left bg-[#e5e9f0] text-[#2e3440] border-[#c0c8d8] hover:opacity-90">
              Clean Light
            </button>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4 border-t border-[var(--border-color)]">
        <button id="cancel-modal-btn" class="px-4 py-2 rounded text-xs border border-[var(--border-color)] hover:bg-[var(--bg-color)]">Cancel</button>
        <button id="save-modal-btn" class="px-5 py-2 rounded text-xs bg-[var(--accent-color)] text-black font-bold hover:opacity-90">Save Changes</button>
      </div>

    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-[var(--board-bg)] border border-[var(--accent-color)] text-[var(--text-color)] px-4 py-3 rounded-lg shadow-xl translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 z-50">
    <i class="fa-solid fa-circle-check text-[var(--accent-color)]"></i>
    <span id="toast-message" class="text-xs font-semibold tracking-wide">Copied shareable URL to clipboard!</span>
  </div>

  <script>
    // Default Target: Feb 15, 2027 22:10:00 UTC
    let currentTargetDate = new Date(Date.UTC(2027, 1, 15, 22, 10, 0)).getTime();
    let timerTitle = "SIX LINE SHIFT";
    let isAudioMuted = true;
    let audioCtx = null;

    // Web Audio Synthesizer for Mechanical Split-Flap Sound
    function playFlapSound() {
      if (isAudioMuted) return;

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        // Generate synthetic click / clack sound using noise buffer
        const bufferSize = audioCtx.sampleRate * 0.025; // 25ms metallic click
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        // Bandpass filter for crisp mechanical flap body
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800 + Math.random() * 400, audioCtx.currentTime);
        filter.Q.setValueAtTime(3, audioCtx.currentTime);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        whiteNoise.start();
      } catch (e) {
        // Fallback or handle muted audio context
      }
    }

    // Map each card element to its current rendered character
    const cards = {};
    const cardIds = ['d2', 'd1', 'd0', 'h1', 'h0', 'm1', 'm0', 's1', 's0'];

    cardIds.forEach(id => {
      const element = document.getElementById(id);
      cards[id] = {
        el: element,
        value: null
      };
      
      // Build internal card markup
      element.innerHTML = `
        <div class="top-half"></div>
        <div class="bottom-half"></div>
      `;
    });

    function setCardValue(id, newValue) {
      const card = cards[id];
      if (card.value === newValue) return;

      const oldValue = card.value !== null ? card.value : newValue;
      card.value = newValue;

      const topHalf = card.el.querySelector('.top-half');
      const bottomHalf = card.el.querySelector('.bottom-half');

      // Static background update
      topHalf.textContent = newValue;
      bottomHalf.textContent = oldValue;

      // Dynamic flip leaves
      const flipTop = document.createElement('div');
      flipTop.className = 'flip-leaf top animate-top';
      flipTop.textContent = oldValue;

      const flipBottom = document.createElement('div');
      flipBottom.className = 'flip-leaf bottom';
      flipBottom.textContent = newValue;

      card.el.appendChild(flipTop);

      playFlapSound();

      flipTop.addEventListener('animationend', () => {
        flipTop.remove();
        card.el.appendChild(flipBottom);
        flipBottom.classList.add('animate-bottom');
      });

      flipBottom.addEventListener('animationend', () => {
        bottomHalf.textContent = newValue;
        flipBottom.remove();
      });
    }

    function updateBoard() {
      const now = new Date().getTime();
      const diff = currentTargetDate - now;
      const isPast = diff < 0;

      // Update T-Minus / T-Plus status
      const statusTag = document.getElementById('status-tag');
      const statusText = document.getElementById('status-text');

      if (isPast) {
        statusText.textContent = 'T-PLUS';
        statusTag.style.borderColor = 'var(--accent-past)';
        statusTag.style.color = 'var(--accent-past)';
      } else {
        statusText.textContent = 'T-MINUS';
        statusTag.style.borderColor = 'var(--accent-color)';
        statusTag.style.color = 'var(--accent-color)';
      }

      const absDiff = Math.abs(diff);

      // Calculations
      const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((absDiff % (1000 * 60)) / 1000);

      // Pad numbers
      const dStr = String(Math.min(days, 999)).padStart(3, '0');
      const hStr = String(hours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      // Update individual digit flaps
      setCardValue('d2', dStr[0]);
      setCardValue('d1', dStr[1]);
      setCardValue('d0', dStr[2]);

      setCardValue('h1', hStr[0]);
      setCardValue('h0', hStr[1]);

      setCardValue('m1', mStr[0]);
      setCardValue('m0', mStr[1]);

      setCardValue('s1', sStr[0]);
      setCardValue('s0', sStr[1]);
    }

    // Target Date Display update helper
    function updateTargetDateDisplay() {
      const targetObj = new Date(currentTargetDate);
      const isoFormatted = targetObj.toUTCString().replace('GMT', 'UTC');
      document.getElementById('target-date-display').textContent = `TARGET: ${isoFormatted.toUpperCase()}`;
      document.getElementById('main-title').textContent = timerTitle;
    }

    // Audio Toggle Handler
    document.getElementById('audio-toggle-btn').addEventListener('click', () => {
      isAudioMuted = !isAudioMuted;
      const audioIcon = document.getElementById('audio-icon');
      if (isAudioMuted) {
        audioIcon.className = 'fa-solid fa-volume-xmark text-red-400';
      } else {
        audioIcon.className = 'fa-solid fa-volume-high text-green-400';
        playFlapSound(); // Test sound on enable
      }
    });

    // Theme Switcher Logic
    function setTheme(themeName) {
      document.body.className = `theme-${themeName} min-h-screen flex flex-col justify-between items-center p-4 md:p-8`;
      saveStateToURL();
    }

    // Quick Presets
    function applyPreset(presetKey) {
      const now = new Date();
      if (presetKey === '1h') {
        currentTargetDate = now.getTime() + (60 * 60 * 1000);
      } else if (presetKey === '24h') {
        currentTargetDate = now.getTime() + (24 * 60 * 60 * 1000);
      } else if (presetKey === '7d') {
        currentTargetDate = now.getTime() + (7 * 24 * 60 * 60 * 1000);
      } else if (presetKey === 'newyear') {
        const nextYear = now.getUTCFullYear() + 1;
        currentTargetDate = Date.UTC(nextYear, 0, 1, 0, 0, 0);
      } else if (presetKey === 'default') {
        currentTargetDate = Date.UTC(2027, 1, 15, 22, 10, 0);
      }
      updateTargetDateDisplay();
      updateBoard();
      saveStateToURL();
      showToast('Preset applied!');
    }

    // Settings Modal Handlers
    const modal = document.getElementById('settings-modal');
    
    document.getElementById('settings-btn').addEventListener('click', () => {
      document.getElementById('input-title').value = timerTitle;
      
      // Convert UTC timestamp to local datetime-local format
      const localDate = new Date(currentTargetDate);
      localDate.setMinutes(localDate.getMinutes() - localDate.getTimezoneOffset());
      document.getElementById('input-datetime').value = localDate.toISOString().slice(0, 16);
      
      modal.classList.remove('hidden');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('cancel-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

    document.getElementById('save-modal-btn').addEventListener('click', () => {
      const titleInput = document.getElementById('input-title').value.trim();
      const datetimeInput = document.getElementById('input-datetime').value;

      if (titleInput) {
        timerTitle = titleInput.toUpperCase();
      }

      if (datetimeInput) {
        currentTargetDate = new Date(datetimeInput).getTime();
      }

      updateTargetDateDisplay();
      updateBoard();
      saveStateToURL();
      modal.classList.add('hidden');
      showToast('Timer updated!');
    });

    // Share & URL Parameter State Management
    function saveStateToURL() {
      const params = new URLSearchParams();
      params.set('t', currentTargetDate);
      params.set('title', timerTitle);
      
      let theme = 'terminal';
      if (document.body.classList.contains('theme-airport')) theme = 'airport';
      if (document.body.classList.contains('theme-scifi')) theme = 'scifi';
      if (document.body.classList.contains('theme-light')) theme = 'light';
      params.set('theme', theme);

      window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
    }

    function loadStateFromURL() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('t')) {
        const parsedT = parseInt(params.get('t'), 10);
        if (!isNaN(parsedT)) currentTargetDate = parsedT;
      }
      if (params.has('title')) {
        timerTitle = params.get('title');
      }
      if (params.has('theme')) {
        setTheme(params.get('theme'));
      }
    }

    document.getElementById('share-btn').addEventListener('click', () => {
      saveStateToURL();
      const currentUrl = window.location.href;

      // Copy using legacy fallback for iframe safety
      const tempInput = document.createElement('input');
      tempInput.value = currentUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast('Sharable link copied to clipboard!');
      } catch (err) {
        showToast('Failed to copy link.');
      }
      document.body.removeChild(tempInput);
    });

    // Fullscreen Support
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          showToast('Fullscreen mode blocked.');
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Toast Notification System
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Initialization
    window.onload = function () {
      loadStateFromURL();
      updateTargetDateDisplay();
      updateBoard();
      setInterval(updateBoard, 1000);
    };
  </script>
</body>
</html>
