<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      color: #ffffff;
    }

    .player-card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      width: 320px;
    }

    .controls {
      margin-top: 1.5rem;
    }

    .audio-btn {
      background-color: #ff5500;
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .audio-btn:hover {
      background-color: #e64c00;
    }

    .audio-btn:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #b3b3b3;
    }

    /* Keep the SoundCloud iframe invisible */
    #sc-player {
      display: none;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <h2>Audio Control</h2>
    
    <div class="controls">
      <button id="toggle-btn" class="audio-btn">Play</button>
    </div>

    <div id="status" class="status">Click Play to start audio</div>
  </div>

  <!-- Embedded Invisible SoundCloud Player -->
  <iframe 
    id="sc-player" 
    src="https://w.soundcloud.com/player/?url=https%3A//on.soundcloud.com/vyCyS0Dli8TZjmee37&auto_play=false" 
    allow="autoplay">
  </iframe>

  <!-- SoundCloud Widget API Library -->
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const iframe = document.getElementById('sc-player');
      const widget = SC.Widget(iframe);
      const toggleBtn = document.getElementById('toggle-btn');
      const statusText = document.getElementById('status');

      let isPlaying = false;

      // Event listener for the Play/Stop button
      toggleBtn.addEventListener('click', () => {
        widget.toggle();
      });

      // Handle SoundCloud API events to keep UI state in sync
      widget.bind(SC.Widget.Events.PLAY, () => {
        isPlaying = true;
        toggleBtn.textContent = 'Stop';
        toggleBtn.style.backgroundColor = '#d32f2f'; // Red for stop
        statusText.textContent = 'Now Playing...';
      });

      widget.bind(SC.Widget.Events.PAUSE, () => {
        isPlaying = false;
        toggleBtn.textContent = 'Play';
        toggleBtn.style.backgroundColor = '#ff5500'; // SoundCloud orange for play
        statusText.textContent = 'Paused';
      });

      widget.bind(SC.Widget.Events.FINISH, () => {
        isPlaying = false;
        toggleBtn.textContent = 'Play';
        toggleBtn.style.backgroundColor = '#ff5500';
        statusText.textContent = 'Finished';
      });
    });
  </script>

</body>
</html>
